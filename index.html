.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;line-height:1.2;text-align:center}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}

const M=(q,c)=>'https://map.baidu.com/search/'+encodeURIComponent(q)+'?querytype=s&wd='+encodeURIComponent(q)+(c?'&c='+c:'');
const tabsEl=document.getElementById('tabs'),view=document.getElementById('view'),nowEl=document.getElementById('now'),toast=document.getElementById('toast');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function localNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+TRIP.utcOffset*3600000);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mins(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+m;}
function show(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1600);}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);show(msg||'已複製');}
  catch(e){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    try{document.execCommand('copy');show(msg||'已複製');}catch(_){show('無法複製，請長按文字選取');}document.body.removeChild(t);}
}
function placeCard(k){const p=PLACES[k];if(!p)return'';
  let h=`<div class="vc"><div class="vn">${esc(p.n)}</div>`;
  if(p.a)h+=`<div class="vl"><span>地址</span><b>${esc(p.a)}</b></div>`;
  if(p.h)h+=`<div class="vl"><span>營業</span><b>${esc(p.h)}</b></div>`;
  if(p.ts)h+=`<div class="vl"><span>電話</span><b>${esc(p.ts)}</b></div>`;
  if(p.x)h+=`<div class="vl"><span>提醒</span><b>${esc(p.x)}</b></div>`;
  h+=`<div class="chips"><a class="chip pri" href="${M(p.q,p.c)}" target="_blank" rel="noopener">百度地圖</a><button type="button" class="chip" data-copy="${esc(p.n+'\n'+(p.a||''))}">複製地址</button>${p.t?`<a class="chip" href="tel:${esc(p.t)}">撥打</a>`:''}</div></div>`;
  return h;}
function hotelBtns(k){const H=HOTELS[k];if(!H)return'';return `<div class="chips"><a class="chip pri" href="${M(H.q,H.c)}" target="_blank" rel="noopener">飯店地圖</a><button type="button" class="chip" data-copy="${esc(H.name+(H.addr?'\n'+H.addr:''))}">複製飯店地址</button>${H.t?`<a class="chip" href="tel:${esc(H.t)}">撥打</a>`:''}${H.link?`<a class="chip" href="${esc(H.link)}" target="_blank" rel="noopener">訂房頁面</a>`:''}</div>`;}
function chipsFor(o){let c='';if(o.p)c+=placeCard(o.p);if(o.hotel)c+=hotelBtns(o.hotel);return c;}
function dayTextOld(day){let s=`【${day.tab}（${day.wd}）${day.title}】\n${day.wx||''}\n`;
  day.items.forEach(it=>{const [a,b,,t,pl,c,,x]=it;const p=x&&x.p?PLACES[x.p]:null;s+=`${a}${b?'–'+b:''} ${t}${pl?'｜'+pl:''}${c?'｜'+c:''}\n`;if(p&&p.a)s+=`　　${p.n}｜${p.a}\n`;});return s.trim();}

const KE={flight:'✈️',move:'🚗',anchor:'📍',hotel:'🏨',meal:'🍽️',plain:'▫️'};
function dayText(day){
  let s=`【${day.tab}（${day.wd}）${day.title}】\n`;
  if(day.wx)s+=`🌤 ${day.wx}\n`;
  if(day.walk)s+=`🚶 ${day.walk}\n`;
  s+=`${day.sum}\n`;
  if(day.warn)s+=`⚠️ ${day.warn}\n`;
  s+='\n';
  day.items.forEach(it=>{const [a,b,k,t,pl,c,n,x]=it;const p=x&&x.p?PLACES[x.p]:null;
    s+=`${a}${b?'–'+b:''} ${KE[k]||''} ${t}${pl?'｜'+pl:''}${c?'｜'+c:''}\n`;
    if(n)s+=`　　💬 ${n}\n`;
    if(p&&p.a)s+=`　　${p.n}｜${p.a}\n`;});
  return s.trim();}
function tripText(){
  let s=`✈️ ${TRIP.title}\n${TRIP.sub}\n\n`;
  s+=DAYS.map(d=>dayText(d)).join('\n\n');
  s+='\n\n🏨 住宿\n'+Object.keys(HOTELS).map(k=>{const H=HOTELS[k];return `${H.name}${H.addr?'｜'+H.addr:''}${H.ts?'｜'+H.ts:''}`;}).join('\n');
  s+='\n\n（天氣為 10 月下旬氣候參考，非預報；標 [verify]／待確認／估算的時間請再確認）';
  return s;}
function lineShare(t){return 'https://line.me/R/share?text='+encodeURIComponent(t);}

const TABS=[{id:'sum',label:'摘要',sub:'總覽'}].concat(DAYS.map((d,i)=>({id:'d'+i,label:d.tab,sub:d.wd})),[{id:'info',label:'資訊',sub:'確認・地址'}]);
let todayIdx=-1,current='sum';

function renderTabs(active){tabsEl.innerHTML='';
  TABS.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(t.id==='d'+todayIdx?' today':'');
    b.setAttribute('role','tab');b.setAttribute('aria-selected',t.id===active?'true':'false');
    b.innerHTML=`${esc(t.label)}<small>${esc(t.sub)}</small>`;b.onclick=()=>{select(t.id);window.scrollTo({top:0});};
    tabsEl.appendChild(b);if(t.id===active)setTimeout(()=>b.scrollIntoView({inline:'center',block:'nearest'}),0);});}

function renderDay(i){const day=DAYS[i],j=localNow(),isToday=ymd(j)===day.d,nm=j.getHours()*60+j.getMinutes();
  let h=`<section class="dh"><h2>${esc(day.tab)}（${esc(day.wd)}）${esc(day.title)}</h2>${day.wx?`<p class="wxl">${esc(day.wx)}</p>`:''}<p class="sum">${esc(day.sum)}</p>
  <div class="meta">${day.walk?`<span class="pill">${esc(day.walk)}</span>`:''}</div>
  ${day.warn?`<p class="warn">${esc(day.warn)}</p>`:''}<div class="acts"><button class="btn" id="cpday">複製今日行程（貼 LINE）</button> <a class="btn" id="lnday" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">分享到 LINE</a></div></section><ol class="tl">`;
  let lineDone=!isToday;
  day.items.forEach(it=>{const [a,b,k,t,pl,c,n,x]=it;const o=x||{};const s=mins(a),e=mins(b)??s+60;let st='';
    if(isToday){if(nm>=e)st=' past';else if(nm>=s)st=' cur';}
    if(!lineDone&&nm<s){h+=`<li class="nowline" aria-label="現在時間"><span>現在</span><hr></li>`;lineDone=true;}
    h+=`<li class="it k-${k}${st}"><div class="tm">${esc(a)}${b?`<i>${esc(b)}</i>`:''}</div><div class="bd"><div class="ttl">${esc(t)}</div>
      ${pl?`<div class="pl">${esc(pl)}</div>`:''}${c?`<div class="cs">${esc(c)}</div>`:''}${n?`<div class="nt">${esc(n)}</div>`:''}${chipsFor(o)}</div></li>`;});
  if(!lineDone)h+=`<li class="nowline"><span>現在</span><hr></li>`;
  view.innerHTML=h+'</ol>';document.getElementById('cpday').onclick=()=>copy(dayText(day),'已複製 '+day.tab+' 行程');document.getElementById('lnday').href=lineShare(dayText(day));}

function secs(list){let h='';list.forEach(sec=>{if(!sec.rows||!sec.rows.length)return;
    h+=`<section class="sec"><h3>${esc(sec.h)}</h3><ul class="list">`+sec.rows.map(r=>`<li>${r.a?`<div class="a">${esc(r.a)}</div>`:''}${r.b?`<div class="b">${esc(r.b)}</div>`:''}${chipsFor(r)}</li>`).join('')+`</ul></section>`;});return h;}
function renderSum(){
  let h=`<section class="sec"><h3>行程摘要</h3><div class="acts" style="margin:0 0 12px"><button class="btn" id="cpall">複製全部行程（貼 LINE）</button></div><div class="tw"><table class="sum"><thead><tr><th>Date</th><th>Main</th><th>Summary</th></tr></thead><tbody>`+
    DAYS.map((d,i)=>`<tr data-go="d${i}"${i===todayIdx?' class="td"':''}><td class="dt"><button type="button" class="lk" data-go="d${i}">${esc(d.tab)}<small>（${esc(d.wd)}）</small></button></td><td class="mn">${esc(d.main||d.title)}</td><td>${d.wx?`<span class="wxs">${esc(d.wx)}</span>`:''}${esc(d.sum)}</td></tr>`).join('')+
    `</tbody></table></div><p class="hint">點日期可跳到當天行程。時間依 Excel「硬排」分頁；標 [verify]、「待確認」、「估算」的時間，出發前請與廠商及司機再確認。天氣為 10 月下旬的氣候參考，不是預報，出發前 3 天再查。</p></section>`;
  view.innerHTML=h+secs(SUMSEC);document.getElementById('cpall').onclick=()=>copy(tripText(),'已複製全部行程');}
function renderInfo(){
  let h='<section class="sec"><h3>飯店</h3>'+Object.keys(HOTELS).map(k=>{const H=HOTELS[k];return `<div class="vc"><div class="vn">${esc(H.name)}</div>${H.addr?`<div class="vl"><span>地址</span><b>${esc(H.addr)}</b></div>`:''}${H.ts?`<div class="vl"><span>電話</span><b>${esc(H.ts)}</b></div>`:''}${H.note?`<div class="vl"><span>備註</span><b>${esc(H.note)}</b></div>`:''}${hotelBtns(k)}</div>`;}).join('')+'</section>';
  h+=secs(INFO);
  if(BUDGET&&BUDGET.rows.length){h+=`<section class="sec"><h3>預算（每人）</h3><table class="bud">`+
    BUDGET.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')+
    (BUDGET.total?`<tr class="tot"><td>${esc(BUDGET.total[0])}</td><td>${esc(BUDGET.total[1])}</td></tr>`:'')+`</table></section>`;}
  view.innerHTML=h;}

function renderNow(){const j=localNow(),i=DAYS.findIndex(d=>d.d===ymd(j));if(i<0){nowEl.hidden=true;return;}
  const nm=j.getHours()*60+j.getMinutes();let cur=null,next=null;
  for(const it of DAYS[i].items){const s=mins(it[0]),e=mins(it[1])??s+60;if(nm>=s&&nm<e&&!cur)cur=it;if(s>nm&&!next)next=it;}
  if(!cur&&!next){nowEl.hidden=true;return;}let h='';
  if(cur)h+=`<div class="row"><div class="lab">現在</div><div class="tx"><b>${esc(cur[3])}</b><span>${esc(cur[0])}–${esc(cur[1]||'')}${cur[4]?'　'+esc(cur[4]):''}</span></div></div>`;
  if(next)h+=`<div class="row"><div class="lab n">下一個</div><div class="tx"><b>${esc(next[3])}</b><span>${esc(next[0])} 開始${next[4]?'　'+esc(next[4]):''}</span></div></div>`;
  nowEl.innerHTML=h;nowEl.hidden=false;}

function select(id){current=id;renderTabs(id);try{localStorage.setItem(TRIP.storageKey,id);}catch(e){}
  if(id==='info')renderInfo();else if(id==='sum')renderSum();else renderDay(+id.slice(1));}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-copy]');if(b)copy(b.dataset.copy,'已複製：可貼到滴滴，或給司機看');const g=e.target.closest&&e.target.closest('[data-go]');if(g&&!b){select(g.dataset.go);window.scrollTo({top:0});}});
(function init(){
  document.getElementById('trip').innerHTML=`${esc(TRIP.title)}<small>${esc(TRIP.sub)}</small>`;document.title=TRIP.title;
  const j=localNow();todayIdx=DAYS.findIndex(d=>d.d===ymd(j));let start=todayIdx>=0?'d'+todayIdx:null;
  if(!start){try{start=localStorage.getItem(TRIP.storageKey);}catch(e){}}
  if(!start||!TABS.some(t=>t.id===start))start='sum';renderNow();select(start);
  setInterval(()=>{renderNow();if(current.startsWith('d')&&+current.slice(1)===todayIdx)renderDay(todayIdx);},60000);
})();
</script>

</body></html>
